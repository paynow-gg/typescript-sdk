name: Update API Spec

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4
        with:
          version: '10.20.0'

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate from the live specs and compile
        run: pnpm build

      - name: Typecheck the generator
        run: pnpm typecheck

      - name: Compare with the published package
        id: check
        working-directory: ${{ runner.temp }}
        run: |
          name=$(node -p "require('$GITHUB_WORKSPACE/package.json').name")

          if npm pack "$name@latest" --silent > tarball.txt 2>/dev/null; then
            mkdir -p published
            tar -xzf "$(cat tarball.txt)" -C published --strip-components=1
          fi

          if diff -r published/dist "$GITHUB_WORKSPACE/dist" > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump the version and commit
        if: steps.check.outputs.changed == 'true'
        run: |
          version=$(npm version patch --no-git-tag-version)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "upd: openapi spec $version"
          git push origin main

      - name: Publish to NPM
        if: steps.check.outputs.changed == 'true'
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
